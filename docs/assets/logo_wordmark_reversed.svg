  <title>Grounded AI Practice - GAP wordmark, reversed</title>
  <desc>White-on-dark version of the GAP wordmark, derived from logo_wordmark.svg. Letterforms Ink to white; the Ember counters of the A are retained, since Ember holds contrast against a dark ground. The background is transparent rather than a hardcoded colour, so the mark works on any dark surface. Created 2026-07-31.</desc>
