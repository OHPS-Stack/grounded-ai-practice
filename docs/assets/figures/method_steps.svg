<title id="t">How a claim earns its place</title>
<desc id="d">Five steps: A claim worth using appears; Find the primary source; tag whose interest it serves - government, academic, vendor, advocacy; Search for what would disconfirm it, not only what supports it; Log what the source directly supports - and what it does not; Cite it in deliverables - or retract it, in the open.</desc>
