<text x="122" y="359.9" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="17" font-weight="500" fill="#27221E" text-anchor="start">Search for what would disconfirm it, not only what</text>
<text x="122" y="384.6" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="17" font-weight="500" fill="#27221E" text-anchor="start">supports it</text>
