<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 303" width="960" height="303" role="img" aria-labelledby="t d">
<title id="t">BridgeAI, at a glance</title>
<desc id="d">BridgeAI is the government&#x27;s own 100 million pound AI programme, launched 2023 and run by Innovate UK; it funds projects and business support as well as training. From launch to the end of 2025: 74.6 of 100 million pounds allocated, 820 plus AI projects funded, 1,700 plus course completions, 126 accreditations.</desc>
<rect width="960" height="303" fill="#27221E"/>
<text x="48" y="56.0" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="24" font-weight="700" fill="#F9F9F9" text-anchor="start">BridgeAI, at a glance</text>
<text x="48" y="90.0" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="16" font-weight="400" fill="#EFEEED" text-anchor="start">The government&#x27;s own £100 million AI programme. Launched 2023, run by Innovate UK; funds</text>
<text x="48" y="113.2" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="16" font-weight="400" fill="#EFEEED" text-anchor="start">projects and business support as well as training. From launch to the end of 2025:</text>
<text x="48.0" y="159.2" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="30" font-weight="700" fill="#F9F9F9" text-anchor="start">£74.6m</text>
<text x="48.0" y="185.2" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#EFEEED" text-anchor="start">of £100m allocated</text>
<text x="264.0" y="159.2" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="30" font-weight="700" fill="#F9F9F9" text-anchor="start">820+</text>
<text x="264.0" y="185.2" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#EFEEED" text-anchor="start">AI projects funded</text>
<text x="480.0" y="159.2" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="30" font-weight="700" fill="#F9F9F9" text-anchor="start">1,700+</text>
<text x="480.0" y="185.2" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#EFEEED" text-anchor="start">course completions</text>
<text x="696.0" y="159.2" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="30" font-weight="700" fill="#F9F9F9" text-anchor="start">126</text>
<text x="696.0" y="185.2" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#EFEEED" text-anchor="start">accreditations</text>
