<text x="48" y="271.8" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#EFEEED" text-anchor="start">Source: Innovate UK, BridgeAI Year 3 report, 2025 · groundedaipractice.co.uk · Aug 2026</text>
