<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 494" width="960" height="494" role="img" aria-labelledby="t d">
<title id="t">Counted in courses, promised in people</title>
<desc id="d">Two figures side by side, in different units. The promise, in people: 10 million workers promised AI training by 2030, announced as 7.5 million in June 2025 and raised in January 2026. The count, in courses: 1,001,147 course completions reported by the eleven partner companies, January 2026, the latest figure published. Below, in a dashed box: people actually trained is not published, the number that would connect the two.</desc>
<rect width="960" height="494" fill="#27221E"/>
<text x="48" y="64.0" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="30" font-weight="700" fill="#F9F9F9" text-anchor="start">Counted in courses, promised in people</text>
<text x="48" y="122" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.08em" fill="#EFEEED">THE PROMISE, IN PEOPLE</text>
<text x="508" y="122" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.08em" fill="#EFEEED">THE COUNT, IN COURSES</text>
<line x1="480" y1="104" x2="480" y2="256" stroke="#6E6E6E" stroke-width="1" opacity="0.6"/>
<text x="48" y="174.0" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="44" font-weight="700" fill="#F9F9F9" text-anchor="start">10 million</text>
<text x="48" y="204.0" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="14" font-weight="400" fill="#EFEEED" text-anchor="start">workers promised AI training by 2030. Announced as</text>
<text x="48" y="224.3" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="14" font-weight="400" fill="#EFEEED" text-anchor="start">7.5 million in June 2025; raised in January 2026.</text>
<text x="508" y="174.0" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="44" font-weight="700" fill="#F15E4B" text-anchor="start">1,001,147</text>
<text x="508" y="204.0" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="14" font-weight="400" fill="#EFEEED" text-anchor="start">course completions reported by the eleven partner</text>
<text x="508" y="224.3" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="14" font-weight="400" fill="#EFEEED" text-anchor="start">companies. January 2026, the latest figure</text>
<text x="508" y="244.6" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="14" font-weight="400" fill="#EFEEED" text-anchor="start">published.</text>
<rect x="48" y="270" width="864" height="68" rx="10" fill="none" stroke="#EFEEED" stroke-width="2" stroke-dasharray="7 5"/>
<text x="72" y="300.0" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="19" font-weight="700" fill="#F9F9F9" text-anchor="start">People actually trained: not published.</text>
<text x="72" y="322.0" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#EFEEED" text-anchor="start">the number that would connect the two</text>
<line x1="48" y1="372" x2="912" y2="372" stroke="#6E6E6E" stroke-width="1" opacity="0.5"/>
<text x="48" y="398.0" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="14" font-weight="400" fill="#EFEEED" text-anchor="start" font-style="italic">Completions are self-reported by the delivery partners; one person can complete several courses, and the count</text>
<text x="48" y="418.3" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="14" font-weight="400" fill="#EFEEED" text-anchor="start" font-style="italic">includes the partners&#x27; own employees.</text>
<text x="48" y="444.9" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#EFEEED" text-anchor="start">Sources: DSIT, AI Skills Boost explainer, 28 Jan 2026; DSIT and No.10, AI Opportunities delivery tracker, Jan 2026; gov.uk,</text>
<text x="48" y="463.0" font-family="'Public Sans', 'Segoe UI', -apple-system, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#EFEEED" text-anchor="start">Prime Minister&#x27;s London Tech Week speech, Jun 2025 · groundedaipractice.co.uk · Aug 2026</text>
</svg>
