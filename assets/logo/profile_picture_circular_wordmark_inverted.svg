  <title>Grounded AI Practice - Circular profile picture, GAP wordmark, inverted</title>
  <desc>Circular avatar built from the primary GAP wordmark (logo_wordmark.svg), matching the construction of the symbol-based profile pictures: inverted treatment — letterforms white, Ember retained, for dark surfaces — on a Ink ground, with a border whose outer edge is flush with the image edge. The wordmark is scaled uniformly at 80% of canvas width, so its proportions, including the deliberate vertical stretch in the master, are unchanged. Live path effects are stripped so this export is plain, self-contained SVG. Created 2026-07-31. True circle with transparent corners, for platforms that do not crop square uploads themselves.</desc>
