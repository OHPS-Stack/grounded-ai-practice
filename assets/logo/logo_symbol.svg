  <title
     id="title1">Grounded AI Practice — Symbol candidate v01</title>
  <desc
     id="desc1">Working candidate, locked 2026-07-24, refined 2026-07-24 (two passes) per creator's annotated feedback. Pass 2 changes: (1) page_white_fill's left cap rebuilt as a true mirror-symmetric C-shape (yellow-box feedback — was two mismatched curve halves meeting the top edge at a slightly sharp angle; both halves now genuinely mirror about the vertical centre, tangent is vertical at the leftmost point, and the top/bottom edges now both start at x=47 instead of 49/45); (2) terminal_handbook_body's right-side flap edge (formerly a curve from ~(266,245) to (284,229)) changed to a straight line per red-arrow feedback; (3) the curve feeding into that flap (from (263,290) to (266,245)) rebuilt with evenly-spaced control points for a cleaner, more symmetrical single bow per blue-arrow feedback. active_underline still unchanged — purple-box resize/proportion feedback remains pending. Palette unchanged: Ink #27221E body, Ember #F15E4B underline, white page/chevron/cursor.</desc>
