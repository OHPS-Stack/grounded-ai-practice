<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" version="1.1" id="grounded_profile_square_inverted">
<title>Grounded AI Practice — Square profile picture, inverted</title>
<desc>Dark-background counterpart to profile_picture_square.svg (the standard/default as of 2026-07-27) — for use on light surfaces where the standard version's white background wouldn't stand out, or wherever a dark badge is preferred. Ink (#27221E) square background, a Paper (#F9F9F9) ring set with a clear gap from the edge, and the reversed logo_symbol (white book body with a spine-shadow gradient for depth, Ink chevron/cursor, Ember underline) centred on top, sized slightly larger than the circular variant's icon per the existing convention — the reversed variant's page_fill is already Ink, so it blends seamlessly into this background by design. This was the original/default square profile picture; on 2026-07-27 the white-background/dark-book version was confirmed as the new standard and this file renamed to _inverted accordingly (spine-shadow opacity left at its original 0.42 here — see profile_picture_circular_inverted.svg's desc for why the dark-book standard needed a deeper 0.92 peak instead).</desc>
<defs>
  <linearGradient id="spineGrad" x1="3.9673222" y1="22.733454" x2="45" y2="22.733454" gradientTransform="matrix(1.0034017,0,0,1.0776948,-0.29951376,0)" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#000000" stop-opacity="0.42"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0"/>
  </linearGradient>
</defs>
<g id="background_fill">
  <rect x="0" y="0" width="1024" height="1024" fill="#27221E"/>
  <rect x="14" y="14" width="996" height="996" fill="none" stroke="#F9F9F9" stroke-width="28"/>
</g>
