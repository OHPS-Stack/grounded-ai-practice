  <title
     id="title1">Grounded AI Practice — Symbol, reversed</title>
  <desc
     id="desc1">White version of the logo symbol for dark backgrounds, derived from logo_symbol_flat.svg. Body Ink→white; chevron/cursor white→Ink (so they still contrast against the now-white body); the page-fill area is transparent (fill:none) rather than a hardcoded colour, so it works on any dark background rather than assuming Ink specifically; the Ember underline is kept as Ember, since accent colours conventionally survive a reversal for brand recognition. Created 2026-07-24.</desc>
