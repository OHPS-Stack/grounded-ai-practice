<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>B05-H Decisions and ADRs — correction candidate v07</title>
  <desc>Clipboard checklist with three decisions and an overlapping diagonal pencil.</desc>

  <!-- Clipboard body -->
  <rect x="128" y="128" width="240" height="286" rx="24"
        fill="#FFFFFF"
        stroke="#0F1C2F"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Clipboard top clip -->
  <path d="M206 128
           V112
           Q206 92 226 92
           H270
           Q290 92 290 112
           V128
           H312
           Q326 128 326 142
           V154
           H170
           V142
           Q170 128 184 128
           Z"
        fill="#FFFFFF"
        stroke="#0F1C2F"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Checklist ticks -->
  <g fill="none"
     stroke="#0F1C2F"
     stroke-width="12"
     stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M164 214 L178 228 L202 198"/>
    <path d="M164 278 L178 292 L202 262"/>
    <path d="M164 342 L178 356 L202 326"/>
  </g>

  <!-- Decision text lines -->
  <g stroke="#0F1C2F"
     stroke-width="12"
     stroke-linecap="round">
    <line x1="226" y1="214" x2="310" y2="214"/>
    <line x1="226" y1="278" x2="300" y2="278"/>
    <line x1="226" y1="342" x2="282" y2="342"/>
  </g>

  <!-- Pencil body -->
  <g transform="translate(-2.2 -49.8) rotate(45 350 330)">
    <!-- Main outlined pencil -->
    <rect x="328" y="250" width="44" height="132" rx="9"
          fill="#FFFFFF"
          stroke="#0F1C2F"
          stroke-width="14"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Coral eraser -->
    <path d="M328 272
             V259
             Q328 250 337 250
             H363
             Q372 250 372 259
             V272 Z"
          fill="#FF5A1F"
          stroke="#0F1C2F"
          stroke-width="10"
          stroke-linejoin="round"/>

    <!-- Pencil tip -->
    <path d="M328 382
             H372
             L350 416 Z"
          fill="#FFFFFF"
          stroke="#0F1C2F"
          stroke-width="14"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Graphite point -->
    <path d="M342 403 L350 416 L358 403 Z"
          fill="#0F1C2F"/>
  </g>
