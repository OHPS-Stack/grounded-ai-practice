<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>B03-A Learning and Documentation — correction candidate v05</title>
  <desc>Closed-book design preserved. Inner vertical line extended to meet the top and bottom page borders. Thin exposed light-grey sections rebuilt as separate smooth slivers to remove bumps at the top-right and bottom-left transitions.</desc>

  <g stroke-linejoin="round">
    <!-- Rear cover with outer dark border -->
    <rect x="140" y="112" width="252" height="304" rx="24"
          fill="#E5E7EB" stroke="#0F1C2F" stroke-width="14"/>

    <!-- Smooth light-grey exposed slivers -->
    <rect x="352" y="102" width="34" height="304" rx="17" fill="#E5E7EB"/>
    <rect x="126" y="382" width="252" height="28" rx="14" fill="#E5E7EB"/>

    <!-- Front cover -->
    <rect x="112" y="92" width="252" height="304" rx="24"
          fill="#FFFFFF" stroke="#0F1C2F" stroke-width="14"/>

    <!-- Left inner line: square-ended and extended to meet the top/bottom borders -->
    <line x1="164" y1="99" x2="164" y2="389"
          stroke="#0F1C2F" stroke-width="18" stroke-linecap="butt"/>

    <!-- Title marks -->
    <line x1="212" y1="208" x2="292" y2="208"
          stroke="#AEB7C3" stroke-width="12" stroke-linecap="round"/>
    <line x1="212" y1="254" x2="276" y2="254"
          stroke="#AEB7C3" stroke-width="12" stroke-linecap="round"/>

    <!-- Bookmark -->
    <path d="M286 92 H340 V232 L313 209 L286 232 Z"
          fill="#FF5A1F" stroke="#0F1C2F" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>