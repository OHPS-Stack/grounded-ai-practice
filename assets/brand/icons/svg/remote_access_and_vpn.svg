<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>B05-G Remote Access and VPN — correction candidate v06</title>
  <desc>Globe with latitude and longitude lines, overlaid by a white padlock shifted slightly up and left.</desc>

  <!-- Globe -->
  <g fill="none"
     stroke="#27221E"
     stroke-width="14"
     stroke-linecap="round"
     stroke-linejoin="round">
    <circle cx="222" cy="246" r="116"/>

    <!-- Longitude curves -->
    <path d="M222 130
             C178 166 178 326 222 362"/>
    <path d="M222 130
             C266 166 266 326 222 362"/>

    <!-- Latitude curves -->
    <path d="M126 186
             C180 216 264 216 318 186"/>
    <path d="M126 306
             C180 276 264 276 318 306"/>

    <!-- Equator -->
    <path d="M106 246 H338"/>
  </g>

  <!-- Lock assembly shifted slightly up and left -->
  <g transform="translate(-76 -12)">
    <!-- Padlock shackle: charcoal outline with white interior -->
    <path d="M316 318
             V286
             C316 250 372 250 372 286
             V318"
          fill="none"
          stroke="#27221E"
          stroke-width="30"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <path d="M316 318
             V286
             C316 250 372 250 372 286
             V318"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="14"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  
    <!-- Lock body -->
    <rect x="290" y="310" width="118" height="108" rx="16"
          fill="#FFFFFF"
          stroke="#27221E"
          stroke-width="14"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  
    <!-- Coral keyhole -->
    <circle cx="349" cy="354" r="13" fill="#F15E4B"/>
    <path d="M349 365 V388"
          stroke="#F15E4B"
          stroke-width="13"
          stroke-linecap="round"/>
  </g>
</svg>
